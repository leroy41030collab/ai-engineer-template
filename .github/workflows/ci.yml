name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agentpass
          POSTGRES_DB: ai_engineer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agent -d ai_engineer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key
          DATABASE_URL: postgresql+psycopg://agent:agentpass@localhost:5432/ai_engineer
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t ai-engineer-template .